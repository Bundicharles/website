<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Habari Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/design-system.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">
  <style>
    .error-page{display:flex;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:var(--space-2xl)}
    .error-code{font-size:8rem;font-family:var(--font-heading);font-weight:900;color:var(--red);opacity:.2;line-height:1;margin-bottom:0}
    .error-title{font-size:2rem;margin-bottom:var(--space-md)}
    .error-desc{color:var(--text-muted);margin-bottom:var(--space-xl)}
  </style>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <div class="error-page">
      <div>
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">The page you're looking for doesn't exist or has been moved.</p>
        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
          <a id="home-link" href="./" class="btn btn-primary">← Back to Home</a>
          <a id="latest-link" href="./pages/latest.html" class="btn btn-outline">Latest News</a>
        </div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <!-- ── Environment config (load BEFORE module scripts) ── -->
  <script src="./assets/js/config.js"></script>

  <script type="module">
    import { renderHeader, renderFooter } from './assets/js/modules/components.js';
    import { getAppBase } from './assets/js/modules/api.js';
    const base = getAppBase();
    document.getElementById('home-link').href = `${base}/`;
    document.getElementById('latest-link').href = `${base}/pages/latest.html`;
    await renderHeader(); await renderFooter();
  </script>
</body>
</html>
