<!DOCTYPE html>
<html lang="en">
<head><script>var m=window.location.pathname;var i=m.indexOf("/admin");var b=i>=0?m.slice(0,i):"";var bs=document.createElement("base");bs.href=b+"/admin/";document.head.appendChild(bs);</script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Article Editor | DK Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/admin.css">
  <style>
    .editor-layout{display:grid;grid-template-columns:1fr 300px;gap:1.5rem;align-items:start}
    @media(max-width:900px){.editor-layout{grid-template-columns:1fr}}
    .sidebar-panel{position:sticky;top:calc(var(--topbar-h) + 1rem);display:flex;flex-direction:column;gap:1rem}
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="admin-sidebar">
    <div class="sidebar-header"><div class="sidebar-logo-mark">DK</div><span class="sidebar-logo-text">DK</span></div>
    <nav class="sidebar-nav">
      <a href="./dashboard.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="./articles.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>Articles</a>
      <a href="./article-edit.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>New Article</a>
      <a href="./categories.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>Categories</a>
      <a href="./media.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Media</a>
      <a href="./settings.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
      <a href="./messages.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Messages</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebar-avatar">A</div><div><div class="user-name" id="sidebar-user-name">�</div><div class="user-role" id="sidebar-user-role">�</div></div></div>
      <button class="btn btn-outline btn-sm" id="logout-btn" style="width:100%;justify-content:center">Sign Out</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <header class="topbar">
    <button class="btn btn-ghost sidebar-toggle" id="sidebar-toggle">?</button>
    <span class="topbar-title" id="page-title">New Article</span>
    <div style="display:flex;gap:.5rem">
      <button class="btn btn-outline btn-sm" id="save-draft-btn">Save Draft</button>
      <button class="btn btn-primary btn-sm" id="publish-btn">Publish</button>
    </div>
  </header>

  <main class="main-content">
    <div id="alert-container"></div>
    <div class="editor-layout">
      <!-- Main editor -->
      <div style="display:flex;flex-direction:column;gap:1rem">
        <div class="card"><div class="card-body">
          <div class="form-group">
            <label>Title *</label>
            <input type="text" id="title" class="form-control" placeholder="Article headline�" required style="font-size:1.05rem;font-weight:600">
          </div>
          <div class="form-group">
            <label>URL Slug</label>
            <input type="text" id="slug" class="form-control" placeholder="auto-generated" style="font-family:monospace;font-size:.85rem">
          </div>
          <div class="form-group">
            <label>Excerpt / Summary</label>
            <textarea id="excerpt" class="form-control" rows="3" placeholder="Short description for article listings�"></textarea>
          </div>
        </div></div>

        <div class="card">
          <div class="card-header"><h3>Article Body</h3></div>
          <div style="padding:0 1.25rem 1.25rem">
            <div class="editor-toolbar">
              <button type="button" class="editor-btn" data-cmd="bold"><b>B</b></button>
              <button type="button" class="editor-btn" data-cmd="italic"><i>I</i></button>
              <button type="button" class="editor-btn" data-cmd="underline"><u>U</u></button>
              <button type="button" class="editor-btn" data-cmd="formatBlock" data-val="h2">H2</button>
              <button type="button" class="editor-btn" data-cmd="formatBlock" data-val="h3">H3</button>
              <button type="button" class="editor-btn" data-cmd="insertUnorderedList">� List</button>
              <button type="button" class="editor-btn" data-cmd="insertOrderedList">1. List</button>
              <button type="button" class="editor-btn" data-cmd="formatBlock" data-val="blockquote">Quote</button>
              <button type="button" class="editor-btn" data-cmd="removeFormat">Clear</button>
            </div>
            <div class="editor-content" id="body-editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Article body"></div>
          </div>
        </div>

        <div class="card"><div class="card-body">
          <div class="form-group">
            <label>Video URL (YouTube or Vimeo)</label>
            <input type="url" id="video_url" class="form-control" placeholder="https://www.youtube.com/watch?v=�">
            <span style="font-size:.72rem;color:var(--muted);margin-top:.25rem;display:block">Paste an authorized YouTube or Vimeo URL. Embed will be generated automatically.</span>
          </div>
        </div></div>

        <div class="card"><div class="card-body">
          <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.75rem">Featured Video (Upload Locally)</div>
          <div id="video-preview" style="margin-bottom:.75rem"></div>
          <input type="hidden" id="featured_video">
          <label class="btn btn-outline btn-sm" style="justify-content:center;cursor:pointer;margin-bottom:.5rem;width:100%">
            ?? Upload Video
            <input type="file" id="video-upload" accept="video/mp4,video/webm,video/ogg,video/quicktime" style="display:none">
          </label>
          <div class="form-group">
            <label>Or paste video URL</label>
            <input type="text" id="video-url-input" class="form-control" placeholder="/api/uploads/images/� or https://�">
          </div>
        </div></div>

        <div class="card"><div class="card-body">
          <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.75rem">Source Attribution</div>
          <div class="form-grid col-2">
            <div class="form-group"><label>Source Name</label><input type="text" id="source_name" class="form-control" placeholder="e.g. Nation Media"></div>
            <div class="form-group"><label>Source URL</label><input type="url" id="source_url" class="form-control" placeholder="https://�"></div>
          </div>
        </div></div>

        <div class="card"><div class="card-body">
          <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.75rem">SEO</div>
          <div class="form-group"><label>SEO Title (leave blank to use article title)</label><input type="text" id="seo_title" class="form-control" maxlength="200"></div>
          <div class="form-group"><label>Meta Description</label><textarea id="seo_description" class="form-control" rows="2" maxlength="500"></textarea></div>
        </div></div>
      </div>

      <!-- Sidebar panel -->
      <div class="sidebar-panel">
        <div class="card"><div class="card-body">
          <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.75rem">Publish</div>
          <div class="form-group"><label>Status</label>
            <select id="status" class="form-control">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
              <option value="archived">Archived</option>
            </select>
          </div>
          <div class="form-group"><label>Content Type</label>
            <select id="content_type" class="form-control">
              <option value="article">Article</option>
              <option value="documentary">Documentary</option>
              <option value="video">Video</option>
            </select>
          </div>
          <div class="form-group"><label>Category *</label>
            <select id="category_id" class="form-control"><option value="">Loading�</option></select>
          </div>
        </div></div>

        <div class="card"><div class="card-body">
          <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.75rem">Flags</div>
          <div style="display:flex;flex-direction:column;gap:.6rem">
            <label class="form-check"><input type="checkbox" id="is_featured"><span>? Featured on homepage</span></label>
            <label class="form-check"><input type="checkbox" id="is_trending"><span>?? Trending</span></label>
            <label class="form-check"><input type="checkbox" id="is_breaking"><span>? Breaking news ticker</span></label>
          </div>
          <div class="form-group" style="margin-top:.75rem">
            <label>Trending Rank (lower = top)</label>
            <input type="number" id="trending_rank" class="form-control" value="0" min="0">
          </div>
        </div></div>

        <div class="card"><div class="card-body">
          <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.75rem">Featured Image</div>
          <div id="img-preview" style="margin-bottom:.75rem"></div>
          <input type="hidden" id="featured_image">
          <label class="btn btn-outline btn-sm" style="justify-content:center;cursor:pointer;margin-bottom:.5rem;width:100%">
            ?? Upload Image
            <input type="file" id="img-upload" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none">
          </label>
          <div class="form-group">
            <label>Or paste image URL</label>
            <input type="text" id="img-url-input" class="form-control" placeholder="/api/uploads/images/� or https://�">
          </div>
        </div></div>

        <div id="delete-panel" style="display:none">
          <button type="button" id="delete-btn" class="btn btn-danger" style="width:100%;justify-content:center">?? Delete Article</button>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="toast-container"></div>
  <!-- -- Environment config (load BEFORE module scripts) -- -->
  <script src="../assets/js/config.js"></script>

  <script type="module">
    import { requireAuth, initSidebar, adminFetch, esc, toast, slugify, getAppBase } from './assets/js/admin-core.js';
  const user = await requireAuth(); initSidebar(user);
  const base = getAppBase();

  const params = new URLSearchParams(window.location.search);
  const editId = params.get('id');
  const isEdit = !!editId;
  if (isEdit) { document.getElementById('page-title').textContent='Edit Article'; document.getElementById('delete-panel').style.display='block'; }

  // Load categories
  const catRes = await adminFetch('/admin/categories');
  const cats   = catRes.data ?? [];
  const catSel = document.getElementById('category_id');
  catSel.innerHTML = '<option value="">Select category�</option>' + cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');

  // Load existing article
  if (isEdit) {
    try {
      const res = await adminFetch(`/admin/articles/${editId}`);
      const a   = res.data;
      document.getElementById('title').value           = a.title || '';
      document.getElementById('slug').value            = a.slug  || '';
      document.getElementById('excerpt').value         = a.excerpt || '';
      document.getElementById('body-editor').innerHTML = a.body  || '';
      document.getElementById('video_url').value       = a.video_url || '';
      document.getElementById('source_name').value     = a.source_name || '';
      document.getElementById('source_url').value      = a.source_url  || '';
      document.getElementById('seo_title').value       = a.seo_title   || '';
      document.getElementById('seo_description').value = a.seo_description || '';
      document.getElementById('status').value          = a.status || 'draft';
      document.getElementById('content_type').value    = a.content_type || 'article';
      document.getElementById('category_id').value     = a.category_id;
      document.getElementById('is_featured').checked   = !!a.is_featured;
      document.getElementById('is_trending').checked   = !!a.is_trending;
      document.getElementById('is_breaking').checked   = !!a.is_breaking;
      document.getElementById('trending_rank').value   = a.trending_rank || 0;
      document.getElementById('featured_image').value  = a.featured_image || '';
      if (a.featured_image) showImgPreview(a.featured_image);
      document.getElementById('featured_video').value  = a.featured_video || '';
      if (a.featured_video) showVideoPreview(a.featured_video);
    } catch (err) { toast('Could not load article: ' + err.message, 'error'); }
  }

  // Auto-slug
  document.getElementById('title').addEventListener('input', e => {
    if (!isEdit) document.getElementById('slug').value = slugify(e.target.value);
  });

  // Toolbar
  document.querySelectorAll('.editor-btn[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', e => {
      e.preventDefault();
      document.execCommand(btn.dataset.cmd, false, btn.dataset.val || null);
    });
  });

  // Image upload
  document.getElementById('img-upload').addEventListener('change', async e => {
    const file = e.target.files?.[0]; if (!file) return;
    try {
      const fd = new FormData(); fd.append('image', file);
      const res = await adminFetch('/admin/media', { method:'POST', body:fd, headers:{} });
      document.getElementById('featured_image').value = res.data.url;
      showImgPreview(res.data.url);
      toast('Image uploaded.', 'success');
    } catch (err) { toast(err.message, 'error'); }
    e.target.value = '';
  });

   document.getElementById('img-url-input').addEventListener('change', e => {
     const url = e.target.value.trim();
     if (url) { document.getElementById('featured_image').value = url; showImgPreview(url); }
   });

   // Video upload
   document.getElementById('video-upload').addEventListener('change', async e => {
     const file = e.target.files?.[0]; if (!file) return;
     try {
       const fd = new FormData(); fd.append('file', file);
       const res = await adminFetch('/admin/media', { method:'POST', body:fd, headers:{} });
       document.getElementById('featured_video').value = res.data.url;
       showVideoPreview(res.data.url);
       toast('Video uploaded.', 'success');
     } catch (err) { toast(err.message, 'error'); }
     e.target.value = '';
   });

   document.getElementById('video-url-input').addEventListener('change', e => {
     const url = e.target.value.trim();
     if (url) { document.getElementById('featured_video').value = url; showVideoPreview(url); }
   });

   function showVideoPreview(url) {
     const previewUrl = url.startsWith('http') ? url : (base + url);
     document.getElementById('video-preview').innerHTML = `<div class="img-preview">
       <video controls style="width:100%;max-width:200px;border-radius:4px" preload="metadata">
         <source src="${esc(previewUrl)}" type="video/mp4">
       </video>
       <button type="button" class="img-preview-remove" id="remove-video">?</button>
     </div>`;
     document.getElementById('remove-video').addEventListener('click', () => {
       document.getElementById('featured_video').value = '';
       document.getElementById('video-url-input').value  = '';
       document.getElementById('video-preview').innerHTML = '';
     });
   }

  function showImgPreview(url) {
    const previewUrl = url.startsWith('http') ? url : (base + url);
    document.getElementById('img-preview').innerHTML = `<div class="img-preview">
      <img src="${esc(previewUrl)}" alt="Preview" onerror="this.style.display='none'">
      <button type="button" class="img-preview-remove" id="remove-img">?</button>
    </div>`;
    document.getElementById('remove-img').addEventListener('click', () => {
      document.getElementById('featured_image').value = '';
      document.getElementById('img-url-input').value  = '';
      document.getElementById('img-preview').innerHTML = '';
    });
  }

  function buildPayload(statusOverride) {
    return {
      title:           document.getElementById('title').value.trim(),
      slug:            document.getElementById('slug').value.trim(),
      excerpt:         document.getElementById('excerpt').value.trim(),
      body:            document.getElementById('body-editor').innerHTML,
      video_url:       document.getElementById('video_url').value.trim(),
      source_name:     document.getElementById('source_name').value.trim(),
      source_url:      document.getElementById('source_url').value.trim(),
      seo_title:       document.getElementById('seo_title').value.trim(),
      seo_description: document.getElementById('seo_description').value.trim(),
      status:          statusOverride || document.getElementById('status').value,
      content_type:    document.getElementById('content_type').value,
      category_id:     parseInt(document.getElementById('category_id').value) || 0,
      is_featured:     document.getElementById('is_featured').checked,
      is_trending:     document.getElementById('is_trending').checked,
      is_breaking:     document.getElementById('is_breaking').checked,
      trending_rank:   parseInt(document.getElementById('trending_rank').value) || 0,
       featured_image:  document.getElementById('featured_image').value.trim(),
       featured_video:  document.getElementById('featured_video').value.trim(),
     };
  }

  async function save(statusOverride) {
    const payload = buildPayload(statusOverride);
    if (!payload.title)       { toast('Title is required.', 'error'); return; }
    if (!payload.category_id) { toast('Please select a category.', 'error'); return; }
    try {
      let res;
      if (isEdit) res = await adminFetch(`/admin/articles/${editId}`, { method:'PUT',  body:JSON.stringify(payload) });
      else        res = await adminFetch('/admin/articles',            { method:'POST', body:JSON.stringify(payload) });
      toast(res.message || 'Saved successfully!', 'success');
      if (!isEdit && res.data?.id) {
        setTimeout(() => window.location.replace(`./article-edit.html?id=${res.data.id}`), 800);
      }
    } catch (err) { toast(err.message, 'error'); }
  }

  document.getElementById('save-draft-btn').addEventListener('click', () => save('draft'));
  document.getElementById('publish-btn').addEventListener('click',    () => save('published'));

  document.getElementById('delete-btn')?.addEventListener('click', async () => {
    if (!window.confirm('Delete this article? This cannot be undone.')) return;
    try {
      await adminFetch(`/admin/articles/${editId}`, { method:'DELETE', body:'{}' });
      toast('Article deleted.', 'success');
      setTimeout(() => window.location.replace('./articles.html'), 800);
    } catch (err) { toast(err.message, 'error'); }
  });
</script>
</body>
</html>
