<!DOCTYPE html>
<html lang="en">
<head><script>var m=window.location.pathname;var i=m.indexOf("/admin");var b=i>=0?m.slice(0,i):"";var bs=document.createElement("base");bs.href=b+"/admin/";document.head.appendChild(bs);</script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Articles | DK Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="admin-sidebar">
    <div class="sidebar-header"><div class="sidebar-logo-mark">DK</div><span class="sidebar-logo-text">DK</span></div>
    <nav class="sidebar-nav">
      <a href="./dashboard.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="./articles.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>Articles</a>
      <a href="./article-edit.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>New Article</a>
      <a href="./categories.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>Categories</a>
      <a href="./articles.html?category=reports" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Reports</a>
      <a href="./media.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Media</a>
      <a href="./engagement.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Engagement</a>
      <a href="./settings.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
      <a href="./messages.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/></svg>Messages</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebar-avatar">A</div><div><div class="user-name" id="sidebar-user-name">�</div><div class="user-role" id="sidebar-user-role">�</div></div></div>
      <button class="btn btn-outline btn-sm" id="logout-btn" style="width:100%;justify-content:center">Sign Out</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="topbar">
    <button class="btn btn-ghost sidebar-toggle" id="sidebar-toggle">?</button>
    <span class="topbar-title">Articles</span>
    <a href="./article-edit.html" class="btn btn-primary btn-sm">+ New Article</a>
  </header>
  <main class="main-content">
    <div class="card">
      <div class="card-header">
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;flex:1">
          <input type="search" id="search-input" placeholder="Search articles�" class="form-control" style="width:240px;padding:.35rem .75rem;font-size:.8rem">
          <select id="status-filter" class="form-control" style="width:130px;padding:.35rem .75rem;font-size:.8rem">
            <option value="">All statuses</option>
            <option value="published">Published</option>
            <option value="draft">Draft</option>
            <option value="archived">Archived</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Title</th><th>Category</th><th>Type</th><th>Status</th><th>Flags</th><th>Published</th><th>Actions</th></tr></thead>
          <tbody id="articles-tbody"></tbody>
        </table>
      </div>
      <div id="pagination-container" style="padding:0 1rem"></div>
    </div>
  </main>
</div>
<div id="toast-container"></div>
  <!-- -- Environment config (load BEFORE module scripts) -- -->
  <script src="../assets/js/config.js?v=3"></script>

  <script type="module">
    import { requireAuth, initSidebar, adminFetch, esc, fmtDate, statusBadge, toast, renderPagination, confirm as adminConfirm } from './assets/js/admin-core.js';
  const user = await requireAuth(); initSidebar(user);
    let currentPage=1, currentStatus='', currentSearch='', currentCategory='';
    const tbody=document.getElementById('articles-tbody');
    const pagCon=document.getElementById('pagination-container');
    const urlParams=new URLSearchParams(window.location.search);
    currentCategory=urlParams.get('category')||'';
    if(currentCategory) document.querySelector('.topbar-title').textContent='Reports';

  async function load(){
    tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--muted)">Loading�</td></tr>';
    try{
      const params={page:currentPage,per_page:20};
      if(currentStatus) params.status=currentStatus;
      if(currentSearch) params.search=currentSearch;
      if(currentCategory) params.category=currentCategory;
      const res=await adminFetch('/admin/articles?'+new URLSearchParams(params));
      const items=res.data??[];
      if(!items.length){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:2rem;color:var(--muted)">No articles found</td></tr>';pagCon.innerHTML='';return;}
      tbody.innerHTML=items.map(a=>{
        const flags=[];
        if(a.is_featured) flags.push('<span style="color:#f59e0b;font-size:.68rem;font-weight:700">? Featured</span>');
        if(a.is_trending) flags.push('<span style="color:#ef4444;font-size:.68rem;font-weight:700">?? Trending</span>');
        if(a.is_breaking) flags.push('<span style="color:#f97316;font-size:.68rem;font-weight:700">? Breaking</span>');
        return `<tr>
          <td style="max-width:260px"><a href="./article-edit.html?id=${a.id}" style="color:var(--text);font-weight:500">${esc(a.title.substring(0,55))}${a.title.length>55?'�':''}</a></td>
          <td style="color:var(--muted);font-size:.78rem">${esc(a.category_name)}</td>
          <td style="color:var(--muted);text-transform:capitalize;font-size:.78rem">${esc(a.content_type)}</td>
          <td>${statusBadge(a.status)}</td>
          <td style="display:flex;flex-direction:column;gap:2px">${flags.join('')||'�'}</td>
          <td style="color:var(--muted);font-size:.72rem;white-space:nowrap">${fmtDate(a.published_at||a.created_at)}</td>
          <td><div class="td-actions">
            <a href="./article-edit.html?id=${a.id}" class="btn btn-ghost btn-sm">Edit</a>
            <a href="../article.html?slug=${esc(a.slug)}" target="_blank" class="btn btn-ghost btn-sm">?</a>
            <button class="btn btn-danger btn-sm" data-delete="${a.id}">Del</button>
          </div></td>
        </tr>`;
      }).join('');
      renderPagination(pagCon, res.meta, p=>{currentPage=p;load();});
      tbody.querySelectorAll('[data-delete]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          if(!adminConfirm('Delete this article? This cannot be undone.')) return;
          try{ await adminFetch(`/admin/articles/${btn.dataset.delete}`,{method:'DELETE',body:'{}'}); toast('Article deleted.','success'); load(); }
          catch(err){ toast(err.message,'error'); }
        });
      });
    }catch(err){tbody.innerHTML=`<tr><td colspan="7" style="text-align:center;padding:2rem;color:#fca5a5">${esc(err.message)}</td></tr>`;}
  }

  document.getElementById('search-input').addEventListener('input', e=>{currentSearch=e.target.value.trim();currentPage=1;load();});
  document.getElementById('status-filter').addEventListener('change', e=>{currentStatus=e.target.value;currentPage=1;load();});
  load();
</script>
</body>
</html>
