<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Categories | DK Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/assets/css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="admin-sidebar">
    <div class="sidebar-header"><div class="sidebar-logo-mark">DK</div><span class="sidebar-logo-text">DK</span></div>
    <nav class="sidebar-nav">
      <a href="./dashboard.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="./articles.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>Articles</a>
      <a href="./article-edit.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>New Article</a>
      <a href="./categories.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>Categories</a>
      <a href="./media.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Media</a>
      <a href="./settings.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
      <a href="./messages.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Messages</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebar-avatar">A</div><div><div class="user-name" id="sidebar-user-name">�</div><div class="user-role" id="sidebar-user-role">�</div></div></div>
      <button class="btn btn-outline btn-sm" id="logout-btn" style="width:100%;justify-content:center">Sign Out</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="topbar">
    <button class="btn btn-ghost sidebar-toggle" id="sidebar-toggle">?</button>
    <span class="topbar-title">Categories</span>
    <button class="btn btn-primary btn-sm" id="new-cat-btn">+ New Category</button>
  </header>
  <main class="main-content">
    <div style="display:grid;grid-template-columns:1fr 340px;gap:1.5rem;align-items:start">
      <div class="card">
        <div class="table-wrap">
          <table><thead><tr><th>Name</th><th>Slug</th><th>Color</th><th>Order</th><th>Active</th><th>Actions</th></tr></thead>
          <tbody id="cats-tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h3 id="form-title">New Category</h3></div>
        <div class="card-body">
          <input type="hidden" id="edit-id">
          <div class="form-group"><label>Name *</label><input type="text" id="cat-name" class="form-control" placeholder="e.g. Business"></div>
          <div class="form-group"><label>Description</label><textarea id="cat-desc" class="form-control" rows="2"></textarea></div>
          <div class="form-group"><label>Accent Color</label><input type="color" id="cat-color" class="form-control" value="#C62828" style="height:40px;padding:4px"></div>
          <div class="form-group"><label>Sort Order</label><input type="number" id="cat-order" class="form-control" value="0" min="0"></div>
          <label class="form-check" style="margin-bottom:1rem"><input type="checkbox" id="cat-active" checked><span>Active (visible on site)</span></label>
          <div style="display:flex;gap:.5rem">
            <button class="btn btn-primary" id="save-cat-btn">Save Category</button>
            <button class="btn btn-ghost" id="cancel-cat-btn">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="toast-container"></div>
  <!-- -- Environment config (load BEFORE module scripts) -- -->
  <script src="../assets/js/config.js"></script>

  <script type="module">
    import { requireAuth, initSidebar, adminFetch, esc, toast, confirm as adminConfirm } from '/admin/assets/js/admin-core.js';
  const user = await requireAuth(); initSidebar(user);

  function resetForm() {
    document.getElementById('edit-id').value  = '';
    document.getElementById('cat-name').value = '';
    document.getElementById('cat-desc').value = '';
    document.getElementById('cat-color').value = '#C62828';
    document.getElementById('cat-order').value = '0';
    document.getElementById('cat-active').checked = true;
    document.getElementById('form-title').textContent = 'New Category';
  }

  async function loadCats() {
    const res  = await adminFetch('/admin/categories');
    const cats = res.data ?? [];
    document.getElementById('cats-tbody').innerHTML = cats.map(c => `<tr>
      <td style="font-weight:600">${esc(c.name)}</td>
      <td style="color:var(--muted);font-family:monospace;font-size:.75rem">${esc(c.slug)}</td>
      <td><span style="display:inline-flex;align-items:center;gap:.4rem"><span style="display:inline-block;width:16px;height:16px;background:${esc(c.color)};border-radius:3px"></span>${esc(c.color)}</span></td>
      <td style="color:var(--muted)">${c.sort_order}</td>
      <td>${c.is_active ? '<span class="status-badge published">Yes</span>' : '<span class="status-badge archived">No</span>'}</td>
      <td><div class="td-actions">
        <button class="btn btn-ghost btn-sm" data-edit="${c.id}"
          data-name="${esc(c.name)}" data-desc="${esc(c.description||'')}"
          data-color="${esc(c.color)}" data-order="${c.sort_order}" data-active="${c.is_active}">Edit</button>
        <button class="btn btn-danger btn-sm" data-del="${c.id}">Del</button>
      </div></td>
    </tr>`).join('') || '<tr><td colspan="6" style="text-align:center;padding:1.5rem;color:var(--muted)">No categories yet</td></tr>';

    document.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('edit-id').value    = btn.dataset.edit;
        document.getElementById('cat-name').value   = btn.dataset.name;
        document.getElementById('cat-desc').value   = btn.dataset.desc;
        document.getElementById('cat-color').value  = btn.dataset.color;
        document.getElementById('cat-order').value  = btn.dataset.order;
        document.getElementById('cat-active').checked = btn.dataset.active === '1';
        document.getElementById('form-title').textContent = 'Edit Category';
        document.getElementById('cat-name').focus();
      });
    });

    document.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!adminConfirm('Delete this category? Articles in it will be unaffected.')) return;
        try {
          await adminFetch(`/admin/categories/${btn.dataset.del}`, { method:'DELETE', body:'{}' });
          toast('Category deleted.', 'success'); loadCats();
        } catch (err) { toast(err.message, 'error'); }
      });
    });
  }

  document.getElementById('save-cat-btn').addEventListener('click', async () => {
    const id   = document.getElementById('edit-id').value;
    const body = {
      name:        document.getElementById('cat-name').value.trim(),
      description: document.getElementById('cat-desc').value.trim(),
      color:       document.getElementById('cat-color').value,
      sort_order:  parseInt(document.getElementById('cat-order').value) || 0,
      is_active:   document.getElementById('cat-active').checked ? 1 : 0,
    };
    if (!body.name) { toast('Name is required.', 'error'); return; }
    try {
      if (id) await adminFetch(`/admin/categories/${id}`, { method:'PUT',  body:JSON.stringify(body) });
      else    await adminFetch('/admin/categories',        { method:'POST', body:JSON.stringify(body) });
      toast('Category saved.', 'success'); resetForm(); loadCats();
    } catch (err) { toast(err.message, 'error'); }
  });

  document.getElementById('cancel-cat-btn').addEventListener('click', resetForm);
  document.getElementById('new-cat-btn').addEventListener('click', () => { resetForm(); document.getElementById('cat-name').focus(); });
  loadCats();
</script>
</body>
</html>
