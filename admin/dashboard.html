<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard | DK Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/assets/css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="admin-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo-mark">DK</div>
      <span class="sidebar-logo-text">DK</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-title">Overview</div>
      <a href="./dashboard.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard
      </a>
      <div class="nav-section-title">Content</div>
      <a href="./articles.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Articles
      </a>
      <a href="./article-edit.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>New Article
      </a>
      <a href="./categories.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>Categories
      </a>
      <a href="./media.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>Media
      </a>
      <div class="nav-section-title">Settings</div>
      <a href="./settings.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings
      </a>
      <a href="./messages.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Messages
        <span id="unread-badge" style="background:var(--red);color:#fff;border-radius:99px;font-size:.65rem;padding:1px 6px;margin-left:.25rem"></span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="sidebar-avatar">A</div>
        <div><div class="user-name" id="sidebar-user-name">Loading…</div><div class="user-role" id="sidebar-user-role">—</div></div>
      </div>
      <button class="btn btn-outline btn-sm" id="logout-btn" style="width:100%;justify-content:center">Sign Out</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <header class="topbar">
    <button class="btn btn-ghost sidebar-toggle" id="sidebar-toggle" aria-label="Toggle menu">☰</button>
    <span class="topbar-title">Dashboard</span>
    <a href="./article-edit.html" class="btn btn-primary btn-sm">+ New Article</a>
    <a href="../" target="_blank" class="btn btn-outline btn-sm">View Site ↗</a>
  </header>

  <main class="main-content">
    <div id="stats-grid" class="stats-grid"></div>
    <div class="dashboard-split-grid">
      <div class="card">
        <div class="card-header"><h3>Recent Articles</h3><a href="./articles.html" style="font-size:.78rem;color:var(--red)">View all →</a></div>
        <div class="table-wrap"><table><thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Date</th></tr></thead><tbody id="recent-articles"></tbody></table></div>
      </div>
      <div class="card">
        <div class="card-header"><h3>Recent Activity</h3></div>
        <div id="audit-log" style="padding:0 1rem 1rem"></div>
      </div>
    </div>
  </main>
</div>
<div id="toast-container"></div>
  <!-- ── Environment config (load BEFORE module scripts) ── -->
  <script src="../assets/js/config.js"></script>

  <script type="module">
    import { requireAuth, initSidebar, adminFetch, esc, fmtDate, statusBadge } from '/admin/assets/js/admin-core.js';
  const user = await requireAuth();
  initSidebar(user);

  const res = await adminFetch('/admin/dashboard');
  const { stats, recent_articles, audit_logs } = res.data;

  document.getElementById('stats-grid').innerHTML = [
    { label:'Total Articles', value:stats.total_articles,   cls:'red'    },
    { label:'Published',      value:stats.published,        cls:'green'  },
    { label:'Drafts',         value:stats.drafts,           cls:'yellow' },
    { label:'Trending',       value:stats.trending,         cls:'blue'   },
    { label:'Documentaries',  value:stats.documentaries,    cls:''       },
    { label:'Political News', value:stats.politics,         cls:''       },
  ].map(s=>`<div class="stat-card ${s.cls}"><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div>`).join('');

  const badge = document.getElementById('unread-badge');
  if (stats.contact_messages > 0) badge.textContent = stats.contact_messages;

  document.getElementById('recent-articles').innerHTML = (recent_articles||[]).map(a=>`<tr>
    <td style="max-width:200px"><a href="./article-edit.html?id=${a.id}" style="color:var(--text)">${esc(a.title.substring(0,45))}${a.title.length>45?'…':''}</a></td>
    <td style="color:var(--muted);font-size:.78rem">${esc(a.category_name)}</td>
    <td>${statusBadge(a.status)}</td>
    <td style="color:var(--muted);font-size:.72rem">${fmtDate(a.published_at||a.created_at)}</td>
  </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;padding:1.5rem;color:var(--muted)">No articles yet</td></tr>';

  document.getElementById('audit-log').innerHTML = (audit_logs||[]).map(l=>`<div style="padding:.55rem 0;border-bottom:1px solid var(--border);font-size:.8rem">
    <span style="color:var(--text);font-weight:600">${esc(l.display_name||'System')}</span>
    <span style="color:var(--muted)"> ${esc(l.action.replace(/_/g,' '))} ${l.entity_type?'· '+esc(l.entity_type):''}</span>
    <span style="float:right;color:var(--muted);font-size:.7rem">${fmtDate(l.created_at)}</span>
  </div>`).join('') || '<p style="color:var(--muted);padding:1rem 0;font-size:.85rem">No activity recorded.</p>';
</script>
</body>
</html>
