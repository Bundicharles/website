      <a href="./article-edit.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>New Article</a>
      <a href="./categories.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>Categories</a>

      <a href="./media.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Media</a>

    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebar-avatar">A</div><div><div class="user-name" id="sidebar-user-name">A</div><div class="user-role" id="sidebar-user-role">Admin</div></div></div>
      <button class="btn btn-outline btn-sm" id="logout-btn" style="width:100%;justify-content:center">Sign Out</button>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="topbar">
    <button class="btn btn-ghost sidebar-toggle" id="sidebar-toggle">☰</button>
    <span class="topbar-title">Engagement — Comments & Replies</span>
  </header>
  <main class="main-content">
    <div id="eng-list"></div>
  </main>
</div>
<div id="toast-container"></div>
<script src="../assets/js/config.js?v=3"></script>
<script type="module">
  import { requireAuth, initSidebar, adminFetch, esc, toast } from './assets/js/admin-core.js';
  const user = await requireAuth(); initSidebar(user);

  const list = document.getElementById('eng-list');

  async function load() {
    list.innerHTML = '<p style="color:var(--muted);padding:1rem">Loading…</p>';
    try {
      const res = await adminFetch('/admin/engagement');
      const items = res.data ?? [];
      if (!items.length) { list.innerHTML = '<p style="color:var(--muted);padding:1rem">No comments yet.</p>'; return; }
      // Group by article
      const byArticle = {};
      items.forEach(c => { (byArticle[c.article_title] = byArticle[c.article_title] || []).push(c); });
      list.innerHTML = Object.entries(byArticle).map(([title, cs]) => `
        <div class="card" style="margin-bottom:1rem">
          <div class="card-header"><h3 style="font-size:.95rem">${esc(title)}</h3></div>
          <div class="card-body">
            ${cs.map(c => `
              <div style="padding:.75rem 0;border-bottom:1px solid var(--border)">
                <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem;flex-wrap:wrap">
                  <strong style="font-size:.85rem">${esc(c.author_name)}</strong>
                  ${c.is_admin ? '<span style="background:var(--red);color:#fff;font-size:.6rem;padding:1px 6px;border-radius:3px">Admin</span>' : ''}
                  ${c.is_approved ? '' : '<span style="background:#5c1010;color:#fca5a5;font-size:.6rem;padding:1px 6px;border-radius:3px">Hidden</span>'}
                  <span style="color:var(--muted);font-size:.72rem">${new Date(c.created_at).toLocaleString()}</span>
                  ${c.parent_id ? `<span style="color:var(--muted);font-size:.72rem">↳ reply to #${c.parent_id}</span>` : ''}
                </div>
                <p style="margin:0 0 .5rem;font-size:.875rem;white-space:pre-wrap">${esc(c.body)}</p>
                <div style="display:flex;gap:.5rem;flex-wrap:wrap">
                  <button class="btn btn-outline btn-sm reply-toggle" data-id="${c.id}">Reply</button>
                  <button class="btn btn-outline btn-sm toggle-approve" data-id="${c.id}" data-approved="${c.is_approved}">${c.is_approved ? 'Hide' : 'Approve'}</button>
                  <button class="btn btn-danger btn-sm del-comment" data-id="${c.id}">Delete</button>
                </div>
                <div class="reply-box" data-id="${c.id}" style="display:none;margin-top:.75rem">
                  <textarea class="form-control reply-text" rows="2" placeholder="Write a reply..." style="margin-bottom:.5rem"></textarea>
                  <button class="btn btn-primary btn-sm send-reply" data-id="${c.id}">Send Reply</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      // Wire reply toggles
      list.querySelectorAll('.reply-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const box = list.querySelector(`.reply-box[data-id="${btn.dataset.id}"]`);
          if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
        });
      });
      // Wire send reply
      list.querySelectorAll('.send-reply').forEach(btn => {
        btn.addEventListener('click', async () => {
          const box = list.querySelector(`.reply-box[data-id="${btn.dataset.id}"]`);
          const text = box.querySelector('.reply-text').value.trim();
          if (!text) { toast('Reply cannot be empty.', 'error'); return; }
          try {
            await adminFetch('/admin/engagement/' + btn.dataset.id + '/reply', { method:'POST', body: JSON.stringify({ body: text }) });
            toast('Reply posted.', 'success');
            load();
          } catch (err) { toast(err.message || 'Failed to reply.', 'error'); }
        });
      });
      // Wire approve/hide
      list.querySelectorAll('.toggle-approve').forEach(btn => {
        btn.addEventListener('click', async () => {
          const approved = btn.dataset.approved === '1' ? 0 : 1;
          try {
            await adminFetch('/admin/engagement/' + btn.dataset.id, { method:'PUT', body: JSON.stringify({ is_approved: approved }) });
            toast(approved ? 'Comment approved.' : 'Comment hidden.', 'success');
            load();
          } catch (err) { toast(err.message || 'Failed.', 'error'); }
        });
      });
      // Wire delete
      list.querySelectorAll('.del-comment').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this comment?')) return;
          try {
            await adminFetch('/admin/engagement/' + btn.dataset.id, { method:'DELETE' });
            toast('Comment deleted.', 'success');
            load();
          } catch (err) { toast(err.message || 'Failed to delete.', 'error'); }
        });
      });
    } catch (err) { list.innerHTML = `<p style="color:#fca5a5;padding:1rem">${esc(err.message)}</p>`; }
  }

  load();
</script>
</body>
</html>
