<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Habari Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--red:#C62828;--red-h:#EF4444;--bg:#090909;--card:#181818;--border:#2A2A2A;--text:#F5F5F5;--muted:#B3B3B3}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .login-container{width:100%;max-width:420px}
    .login-logo{text-align:center;margin-bottom:2rem}
    .logo-mark{width:52px;height:52px;background:var(--red);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;font-size:1.4rem;color:#fff;margin-bottom:.75rem}
    .login-logo h1{font-family:'Playfair Display',serif;font-size:1.75rem;font-weight:700;letter-spacing:-.02em}
    .login-logo h1 span{color:var(--red)}
    .login-logo p{color:var(--muted);font-size:.875rem;margin-top:.25rem}
    .login-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:2rem}
    .form-group{margin-bottom:1.25rem}
    label{display:block;font-size:.875rem;font-weight:600;margin-bottom:.4rem;color:var(--muted)}
    input{width:100%;padding:.6rem 1rem;background:#111;border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:.95rem;transition:border-color .15s}
    input:focus{outline:none;border-color:var(--red)}
    .btn-submit{width:100%;padding:.75rem;background:var(--red);color:#fff;border:none;border-radius:6px;font-size:1rem;font-weight:700;cursor:pointer;transition:background .15s;margin-top:.5rem}
    .btn-submit:hover:not(:disabled){background:var(--red-h)}
    .btn-submit:disabled{opacity:.6;cursor:not-allowed}
    .error-msg{background:#5c1010;border:1px solid var(--red);padding:.75rem 1rem;border-radius:6px;color:#fca5a5;font-size:.875rem;margin-bottom:1.25rem;display:none}
    .error-msg.show{display:block}
    .footer-note{text-align:center;margin-top:1.25rem;font-size:.78rem;color:var(--muted)}
    .footer-note a{color:var(--red)}
    @media(prefers-color-scheme:dark){body{background:var(--bg)}}
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">
      <div class="logo-mark">HH</div>
      <h1>Habari<span>Hub</span></h1>
      <p>Content Management System</p>
    </div>
    <div class="login-card">
      <div id="error-msg" class="error-msg" role="alert"></div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-submit" id="submit-btn">Sign In</button>
      </form>
      <div class="footer-note">
        <a id="back-link" href="../">← Back to website</a>
      </div>
    </div>
  </div>

  <!-- ── Environment config (load BEFORE module scripts) ── -->
  <script src="../assets/js/config.js"></script>

  <script type="module">
    import { getAppBase, adminFetch, setAuthToken, setCsrfToken } from './assets/js/admin-core.js';

    const base = getAppBase();
    document.getElementById('back-link').href = `${base}/` || '/';

    // Redirect if already logged in (skip if redirected due to unauthenticated session)
    const isUnauth = new URLSearchParams(window.location.search).has('unauth');
    if (!isUnauth) {
      try {
        const res = await adminFetch('/admin/me');
        if (res.data?.id) {
          window.location.replace(`${base}/admin/dashboard.html`);
        }
      } catch {}
    }

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn   = document.getElementById('submit-btn');
      const errEl = document.getElementById('error-msg');
      errEl.className = 'error-msg';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        errEl.textContent = 'Please enter your username and password.';
        errEl.className   = 'error-msg show';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Signing in…';

      try {
        const res = await adminFetch('/admin/login', {
          method: 'POST',
          body: JSON.stringify({ username, password }),
        });

        if (res.success) {
          if (res.data?.csrf_token) {
            setCsrfToken(res.data.csrf_token);
          }
          if (res.data?.token) {
            setAuthToken(res.data.token);
          }
          window.location.replace(`${base}/admin/dashboard.html`);
        } else {
          errEl.textContent = res.message || 'Login failed.';
          errEl.className   = 'error-msg show';
          btn.disabled      = false;
          btn.textContent   = 'Sign In';
        }
      } catch (err) {
        errEl.textContent = err.message || 'Could not connect to the server. Please ensure Apache and MySQL are running in XAMPP.';
        errEl.className   = 'error-msg show';
        btn.disabled      = false;
        btn.textContent   = 'Sign In';
      }
    });
  </script>
</body>
</html>
