<!DOCTYPE html>
<html lang="en">
<head><script>var m=window.location.pathname;var i=m.indexOf("/admin");var b=i>=0?m.slice(0,i):"";var bs=document.createElement("base");bs.href=b+"/admin/";document.head.appendChild(bs);</script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Messages | DK Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="admin-sidebar">
    <div class="sidebar-header"><div class="sidebar-logo-mark">DK</div><span class="sidebar-logo-text">DK</span></div>
    <nav class="sidebar-nav">
      <a href="./dashboard.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="./articles.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>Articles</a>
      <a href="./article-edit.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>New Article</a>
      <a href="./categories.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>Categories</a>
      <a href="./media.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Media</a>
      <a href="./settings.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
      <a href="./messages.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/></svg>Messages</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebar-avatar">A</div><div><div class="user-name" id="sidebar-user-name">—</div><div class="user-role" id="sidebar-user-role">—</div></div></div>
      <button class="btn btn-outline btn-sm" id="logout-btn" style="width:100%;justify-content:center">Sign Out</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="topbar">
    <button class="btn btn-ghost sidebar-toggle" id="sidebar-toggle">☰</button>
    <span class="topbar-title">Contact Messages</span>
  </header>
  <main class="main-content">
    <div class="messages-layout">
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>From</th><th>Subject</th><th>Date</th><th>Read</th></tr></thead>
            <tbody id="msgs-tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="card" id="msg-detail" style="display:none;position:sticky;top:calc(var(--topbar-h)+1rem)">
        <div class="card-header"><h3>Message Detail</h3><button id="close-msg" class="btn btn-ghost btn-sm">✕</button></div>
        <div class="card-body" id="msg-body"></div>
      </div>
    </div>
  </main>
</div>
<div id="toast-container"></div>
  <!-- ── Environment config (load BEFORE module scripts) ── -->
  <script src="../assets/js/config.js?v=3"></script>

  <script type="module">
    import { requireAuth, initSidebar, adminFetch, esc, fmtDate } from './assets/js/admin-core.js';
  const user = await requireAuth(); initSidebar(user);

  const tbody  = document.getElementById('msgs-tbody');
  const detail = document.getElementById('msg-detail');
  const msgBody = document.getElementById('msg-body');

  document.getElementById('close-msg').addEventListener('click', () => { detail.style.display = 'none'; });

  const res  = await adminFetch('/admin/messages');
  const msgs = res.data ?? [];

  if (!msgs.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--muted)">No messages yet.</td></tr>';
  } else {
    tbody.innerHTML = msgs.map(m => `<tr style="cursor:pointer${!m.is_read ? ';font-weight:600' : ''}" data-id="${m.id}">
      <td>
        <div style="font-weight:${m.is_read?'400':'600'}">${esc(m.name)}</div>
        <div style="color:var(--muted);font-size:.72rem">${esc(m.email)}</div>
      </td>
      <td style="font-size:.85rem">${esc(m.subject)}</td>
      <td style="font-size:.72rem;color:var(--muted);white-space:nowrap">${fmtDate(m.created_at)}</td>
      <td style="text-align:center">${m.is_read ? '<span style="color:var(--muted)">✓</span>' : '<span style="color:var(--red);font-size:1rem">●</span>'}</td>
    </tr>`).join('');

    tbody.querySelectorAll('tr[data-id]').forEach(row => {
      row.addEventListener('click', async () => {
        try {
          const r = await adminFetch(`/admin/messages/${row.dataset.id}`);
          const m = r.data;
          msgBody.innerHTML = `
            <div style="margin-bottom:1rem">
              <p style="margin-bottom:.3rem"><strong>From:</strong> ${esc(m.name)}</p>
              <p style="margin-bottom:.3rem"><strong>Email:</strong> <a href="mailto:${esc(m.email)}" style="color:var(--red)">${esc(m.email)}</a></p>
              <p style="margin-bottom:.3rem"><strong>Subject:</strong> ${esc(m.subject)}</p>
              <p style="color:var(--muted);font-size:.78rem"><strong>Received:</strong> ${fmtDate(m.created_at)}</p>
            </div>
            <hr style="border:none;border-top:1px solid var(--border);margin:1rem 0">
            <p style="white-space:pre-wrap;line-height:1.75;font-size:.9rem;color:var(--text)">${esc(m.message)}</p>
            <div style="margin-top:1.5rem;display:flex;gap:.5rem;flex-wrap:wrap">
              <a href="mailto:${esc(m.email)}?subject=Re: ${esc(m.subject)}" class="btn btn-primary btn-sm">Reply via Email</a>
            </div>`;
          detail.style.display = 'block';
          // Mark row as read visually
          row.style.fontWeight = '400';
          row.querySelector('td:last-child').innerHTML = '<span style="color:var(--muted)">✓</span>';
        } catch (err) { console.error(err); }
      });
    });
  }
</script>
</body>
</html>
