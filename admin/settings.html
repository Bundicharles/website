<!DOCTYPE html>
<html lang="en">
<head><script>var m=window.location.pathname;var i=m.indexOf("/admin");var b=i>=0?m.slice(0,i):"";var bs=document.createElement("base");bs.href=b+"/admin/";document.head.appendChild(bs);</script>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Settings | DK Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="admin-sidebar">
    <div class="sidebar-header"><div class="sidebar-logo-mark">DK</div><span class="sidebar-logo-text">DK</span></div>
    <nav class="sidebar-nav">
      <a href="./dashboard.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="./articles.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>Articles</a>
      <a href="./article-edit.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>New Article</a>
      <a href="./categories.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>Categories</a>
      <a href="./media.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Media</a>
      <a href="./settings.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>Settings</a>
      <a href="./messages.html" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/></svg>Messages</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><div class="user-avatar" id="sidebar-avatar">A</div><div><div class="user-name" id="sidebar-user-name">�</div><div class="user-role" id="sidebar-user-role">�</div></div></div>
      <button class="btn btn-outline btn-sm" id="logout-btn" style="width:100%;justify-content:center">Sign Out</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="topbar">
    <button class="btn btn-ghost sidebar-toggle" id="sidebar-toggle">?</button>
    <span class="topbar-title">Site Settings</span>
    <button class="btn btn-primary btn-sm" id="save-btn">Save All Settings</button>
  </header>
  <main class="main-content">
    <div id="save-alert" class="alert" style="display:none"></div>
    <div style="display:flex;flex-direction:column;gap:1rem">
      <div class="card"><div class="card-header"><h3>General</h3></div><div class="card-body">
        <div class="form-grid col-2">
          <div class="form-group"><label>Site Name</label><input type="text" id="s_site_name" class="form-control"></div>
          <div class="form-group"><label>Tagline</label><input type="text" id="s_site_tagline" class="form-control"></div>
          <div class="form-group"><label>Contact Email</label><input type="email" id="s_site_email" class="form-control"></div>
          <div class="form-group"><label>Phone</label><input type="text" id="s_site_phone" class="form-control"></div>
          <div class="form-group"><label>Address</label><input type="text" id="s_site_address" class="form-control"></div>
          <div class="form-group"><label>Articles Per Page</label><input type="number" id="s_articles_per_page" class="form-control" min="3" max="50"></div>
          <div class="form-group" style="grid-column:span 2"><label>Site Description</label><textarea id="s_site_description" class="form-control" rows="2"></textarea></div>
          <div class="form-group" style="grid-column:span 2"><label>Footer About Text</label><textarea id="s_footer_about" class="form-control" rows="2"></textarea></div>
        </div>
      </div></div>

      <div class="card"><div class="card-header"><h3>Social Media Links</h3></div><div class="card-body">
        <div class="form-grid col-2">
          <div class="form-group"><label>Twitter / X URL</label><input type="url" id="s_twitter_url" class="form-control" placeholder="https://twitter.com/�"></div>
          <div class="form-group"><label>Facebook URL</label><input type="url" id="s_facebook_url" class="form-control" placeholder="https://facebook.com/�"></div>
          <div class="form-group"><label>YouTube URL</label><input type="url" id="s_youtube_url" class="form-control" placeholder="https://youtube.com/@�"></div>
          <div class="form-group"><label>Instagram URL</label><input type="url" id="s_instagram_url" class="form-control" placeholder="https://instagram.com/�"></div>
        </div>
      </div></div>

      <div class="card"><div class="card-header"><h3>SEO Defaults</h3></div><div class="card-body">
        <div class="form-group"><label>Default Page Title</label><input type="text" id="s_seo_default_title" class="form-control"></div>
        <div class="form-group"><label>Default Meta Description</label><textarea id="s_seo_default_desc" class="form-control" rows="2"></textarea></div>
      </div></div>
    </div>
  </main>
</div>
<div id="toast-container"></div>
  <!-- -- Environment config (load BEFORE module scripts) -- -->
  <script src="../assets/js/config.js?v=2"></script>

  <script type="module">
    import { requireAuth, initSidebar, adminFetch, toast } from './assets/js/admin-core.js';
  const user = await requireAuth(); initSidebar(user);

  const keys = ['site_name','site_tagline','site_email','site_phone','site_address','site_description',
                 'footer_about','twitter_url','facebook_url','youtube_url','instagram_url',
                 'seo_default_title','seo_default_desc','articles_per_page'];

  const res = await adminFetch('/admin/settings');
  const settings = res.data ?? {};
  keys.forEach(k => { const el = document.getElementById('s_' + k); if (el) el.value = settings[k] || ''; });

  document.getElementById('save-btn').addEventListener('click', async () => {
    const payload = {};
    keys.forEach(k => { const el = document.getElementById('s_' + k); if (el) payload[k] = el.value.trim(); });
    try {
      await adminFetch('/admin/settings', { method:'POST', body:JSON.stringify(payload) });
      toast('Settings saved successfully.', 'success');
    } catch (err) { toast(err.message, 'error'); }
  });
</script>
</body>
</html>
