<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Latest news from Kenya � breaking stories, politics, society, and more from DK.">
  <title>Latest News | DK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <style>
    .page-hero{background:var(--bg-secondary);padding:var(--space-xl) 0;border-bottom:1px solid var(--border)}
    .page-hero h1{font-size:2rem;margin-bottom:.25rem}
    .filter-bar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:var(--space-xl)}
    .filter-btn{padding:.35rem .9rem;border:1px solid var(--border);border-radius:99px;font-size:.8rem;font-weight:600;color:var(--text-muted);background:none;cursor:pointer;transition:all var(--trans-fast)}
    .filter-btn:hover,.filter-btn.active{border-color:var(--red);color:var(--red);background:var(--red-subtle)}
    .search-bar{display:flex;gap:.5rem;margin-bottom:var(--space-xl)}
    .search-bar input{flex:1;padding:.5rem 1rem;background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);border-radius:var(--radius);font-size:.9rem}
    .search-bar input:focus{outline:none;border-color:var(--red)}
    .search-bar button{padding:.5rem 1.25rem;background:var(--red);color:#fff;border-radius:var(--radius);font-weight:600;border:none;cursor:pointer}
  </style>
</head>
<body>
  <header id="site-header" role="banner">
    <div class="container header-inner">
      <a href="../" class="nav-brand" aria-label="DK – Home">
        <img src="../assets/images/logo-dk.svg" alt="DK logo" class="nav-logo-img">
        <span class="nav-logo-text">DK</span>
      </a>
      <nav class="primary-nav" aria-label="Main navigation">
        <a href="../" class="nav-link">Home</a>
        <a href="../pages/latest.html" class="nav-link" aria-current="page">Latest News</a>
        <a href="../pages/trending.html" class="nav-link">Trending</a>
        <a href="../pages/politics.html" class="nav-link">Politics</a>
        <a href="../pages/documentary.html" class="nav-link">DK Documentary</a>
        <a href="../pages/reports.html" class="nav-link">Reports</a>
        <a href="../pages/about.html" class="nav-link">About</a>
        <a href="../pages/contact.html" class="nav-link">Contact</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn search-toggle" id="search-toggle" aria-label="Search" aria-controls="search-overlay" aria-expanded="false">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <button class="icon-btn hamburger" id="hamburger" aria-label="Toggle navigation menu" aria-controls="mobile-menu" aria-expanded="false">
          <svg width="22" height="16" fill="none" viewBox="0 0 22 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="1" y1="3" x2="21" y2="3"/><line x1="1" y1="8" x2="21" y2="8"/><line x1="1" y1="13" x2="21" y2="13"/></svg>
        </button>
      </div>
    </div>
    <nav class="mobile-menu" id="mobile-menu" aria-label="Mobile navigation">
      <a href="../" class="mobile-nav-link mobile-nav-link-home">
        <img src="../assets/images/logo-dk.svg" alt="DK logo" class="nav-logo-img">DK
      </a>
      <a href="../pages/latest.html" class="mobile-nav-link" aria-current="page">Latest News</a>
      <a href="../pages/trending.html" class="mobile-nav-link">Trending</a>
      <a href="../pages/politics.html" class="mobile-nav-link">Politics</a>
      <a href="../pages/documentary.html" class="mobile-nav-link">DK Documentary</a>
      <a href="../pages/reports.html" class="mobile-nav-link">Reports</a>
      <a href="../pages/about.html" class="mobile-nav-link">About</a>
      <a href="../pages/contact.html" class="mobile-nav-link">Contact</a>
    </nav>
    <div class="search-overlay" id="search-overlay" role="dialog" aria-label="Site search" aria-modal="true">
      <div class="search-box">
        <form id="header-search-form" action="../pages/search.html" method="get">
          <input type="search" name="q" id="header-search-input" class="search-input" placeholder="Search DK…" autocomplete="off" aria-label="Search query">
          <button type="submit" class="search-submit" aria-label="Submit search">
            <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
          </button>
        </form>
      </div>
      <button class="search-close" id="search-close" aria-label="Close search">✕</button>
    </div>
  </header>
  <div id="breaking-ticker" class="ticker-bar" role="region" aria-label="Breaking news"></div>
  <div class="page-hero"><div class="container"><h1>Latest News</h1><p style="color:var(--text-muted)">The newest stories from across Kenya, in order of publication.</p></div></div>
  <main style="padding:var(--space-2xl) 0">
    <div class="container">
      <div class="search-bar">
        <input type="search" id="search-input" placeholder="Search latest news�" aria-label="Search articles">
        <button id="search-btn">Search</button>
      </div>
      <div class="filter-bar" id="category-filters">
        <button class="filter-btn active" data-cat="">All</button>
      </div>
      <div id="articles-grid" class="grid-3"></div>
      <div id="pagination-container"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
    <!-- Video Modal (inline play) -->
  <div id="video-modal" class="video-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="video-modal-content">
      <button class="video-modal-close" aria-label="Close">✕</button>
      <div id="video-modal-player"></div>
    </div>
  </div>
  <div id="toast-container"></div>
  <!-- -- Environment config (load BEFORE module scripts) -- -->
  <script src="../assets/js/config.js?v=3"></script>

  <script type="module">
    import { renderFooter, renderTicker } from '../assets/js/modules/components.js?v=3';
    import { initHeaderNav } from '../assets/js/modules/header-nav.js?v=3';
    import { api } from '../assets/js/modules/api.js?v=3';
    import { cardHtml, skeletonCards, emptyState, errorState, paginationHtml, esc, initVideoPreviews, initVideoModal } from '../assets/js/modules/utils.js?v=3';
    initHeaderNav();
    await renderFooter(); renderTicker();

    let currentPage=1, currentCat='', currentSearch='';
    const grid=document.getElementById('articles-grid');
    const pag=document.getElementById('pagination-container');
    const searchInput=document.getElementById('search-input');

    async function loadCategories(){
      try{
        const res=await api.categories();
        const cats=res.data??[];
        const bar=document.getElementById('category-filters');
        cats.forEach(c=>{
          const btn=document.createElement('button');
          btn.className='filter-btn'; btn.dataset.cat=c.slug;
          btn.textContent=c.name; bar.appendChild(btn);
        });
        bar.addEventListener('click',e=>{
          const btn=e.target.closest('.filter-btn');
          if(!btn)return;
          bar.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          currentCat=btn.dataset.cat; currentPage=1; load();
        });
      }catch(err){
        const bar=document.getElementById('category-filters');
        bar.innerHTML='<span style="color:var(--text-muted);font-size:.875rem">Could not load categories. Showing all articles.</span>';
      }
    }

    async function load(){
      grid.innerHTML=skeletonCards(6);
      pag.innerHTML='';
      try{
        let res;
        const params={page:currentPage,per_page:12};
        if(currentSearch.length>=2){
          params.q=currentSearch;
          res=await api.search(params);
        } else if(currentCat){
          params.category=currentCat;
          res=await api.articles(params);
        } else {
          res=await api.latest(params);
        }
        const items=res.data??[];
        grid.innerHTML=items.length?items.map(cardHtml).join(''):emptyState('No articles found.');
        pag.innerHTML=paginationHtml(res.meta,p=>{currentPage=p;load();window.scrollTo({top:0,behavior:'smooth'})});
      }catch(err){grid.innerHTML=errorState(err.message);}
    }

    document.getElementById('search-btn').addEventListener('click',()=>{
      currentSearch=searchInput.value.trim(); currentPage=1; load();
    });
    searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'){currentSearch=searchInput.value.trim();currentPage=1;load();}});

    // Read URL param
    const urlCat=new URLSearchParams(window.location.search).get('category')||'';
    currentCat=urlCat;
    await loadCategories();
    if(urlCat){
      document.querySelectorAll('.filter-btn').forEach(b=>{
        b.classList.toggle('active',b.dataset.cat===urlCat);
      });
    }
    load();
    initVideoPreviews();
    initVideoModal();
  </script>
</body>
</html>
