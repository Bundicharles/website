<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Latest news from Kenya – breaking stories, politics, society, and more from DK.">
  <title>Latest News | DK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <style>
    .page-hero{background:var(--bg-secondary);padding:var(--space-xl) 0;border-bottom:1px solid var(--border)}
    .page-hero h1{font-size:2rem;margin-bottom:.25rem}
    .filter-bar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:var(--space-xl)}
    .filter-btn{padding:.35rem .9rem;border:1px solid var(--border);border-radius:99px;font-size:.8rem;font-weight:600;color:var(--text-muted);background:none;cursor:pointer;transition:all var(--trans-fast)}
    .filter-btn:hover,.filter-btn.active{border-color:var(--red);color:var(--red);background:var(--red-subtle)}
    .search-bar{display:flex;gap:.5rem;margin-bottom:var(--space-xl)}
    .search-bar input{flex:1;padding:.5rem 1rem;background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);border-radius:var(--radius);font-size:.9rem}
    .search-bar input:focus{outline:none;border-color:var(--red)}
    .search-bar button{padding:.5rem 1.25rem;background:var(--red);color:#fff;border-radius:var(--radius);font-weight:600;border:none;cursor:pointer}
  </style>
</head>
<body>
  <header id="site-header"></header>
  <div id="ticker" class="ticker-bar"></div>
  <div class="page-hero"><div class="container"><h1>Latest News</h1><p style="color:var(--text-muted)">The newest stories from across Kenya, in order of publication.</p></div></div>
  <main style="padding:var(--space-2xl) 0">
    <div class="container">
      <div class="search-bar">
        <input type="search" id="search-input" placeholder="Search latest news…" aria-label="Search articles">
        <button id="search-btn">Search</button>
      </div>
      <div class="filter-bar" id="category-filters">
        <button class="filter-btn active" data-cat="">All</button>
      </div>
      <div id="articles-grid" class="grid-3"></div>
      <div id="pagination-container"></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <div id="toast-container"></div>
  <!-- -- Environment config (load BEFORE module scripts) -- -->
  <script src="../assets/js/config.js?v=2"></script>

  <script type="module">
    import { renderHeader, renderFooter, renderTicker } from '../assets/js/modules/components.js?v=2';
    import { api } from '../assets/js/modules/api.js?v=2';
    import { cardHtml, skeletonCards, emptyState, errorState, paginationHtml, esc, initVideoPreviews, initVideoModal } from '../assets/js/modules/utils.js?v=2';
    await renderHeader('Latest News'); await renderFooter(); renderTicker();

    let currentPage=1, currentCat='', currentSearch='';
    const grid=document.getElementById('articles-grid');
    const pag=document.getElementById('pagination-container');
    const searchInput=document.getElementById('search-input');

    async function loadCategories(){
      try{
        const res=await api.categories();
        const cats=res.data??[];
        const bar=document.getElementById('category-filters');
        cats.forEach(c=>{
          const btn=document.createElement('button');
          btn.className='filter-btn'; btn.dataset.cat=c.slug;
          btn.textContent=c.name; bar.appendChild(btn);
        });
        bar.addEventListener('click',e=>{
          const btn=e.target.closest('.filter-btn');
          if(!btn)return;
          bar.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          currentCat=btn.dataset.cat; currentPage=1; load();
        });
      }catch(err){
        const bar=document.getElementById('category-filters');
        bar.innerHTML='<span style="color:var(--text-muted);font-size:.875rem">Could not load categories. Showing all articles.</span>';
      }
    }

    async function load(){
      grid.innerHTML=skeletonCards(6);
      pag.innerHTML='';
      try{
        let res;
        const params={page:currentPage,per_page:12};
        if(currentSearch.length>=2){
          params.q=currentSearch;
          res=await api.search(params);
        } else if(currentCat){
          params.category=currentCat;
          res=await api.articles(params);
        } else {
          res=await api.latest(params);
        }
        const items=res.data??[];
        grid.innerHTML=items.length?items.map(cardHtml).join(''):emptyState('No articles found.');
        pag.innerHTML=paginationHtml(res.meta,p=>{currentPage=p;load();window.scrollTo({top:0,behavior:'smooth'})});
      }catch(err){grid.innerHTML=errorState(err.message);}
    }

    document.getElementById('search-btn').addEventListener('click',()=>{
      currentSearch=searchInput.value.trim(); currentPage=1; load();
    });
    searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'){currentSearch=searchInput.value.trim();currentPage=1;load();}});

    // Read URL param
    const urlCat=new URLSearchParams(window.location.search).get('category')||'';
    currentCat=urlCat;
    await loadCategories();
    if(urlCat){
      document.querySelectorAll('.filter-btn').forEach(b=>{
        b.classList.toggle('active',b.dataset.cat===urlCat);
      });
    }
    load();
    initVideoPreviews();
    initVideoModal();
  </script>
</body>
</html>
